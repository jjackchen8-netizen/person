# ============================================================
# 部署 VitePress 博客到 GitHub Pages
# 每次推送到 main 分支时自动构建并部署
# ============================================================

name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 🔧 安装依赖
        run: pnpm install

      - name: 🏗️ 构建 VitePress
        run: pnpm build

      - name: 📄 配置 Pages
        uses: actions/configure-pages@v5

      - name: 📤 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
